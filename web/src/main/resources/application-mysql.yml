# MySQL 环境配置：连接信息一律由环境变量提供，不在版本库中保留任何默认主机/账号/密码。
# 本地开发请在 web/config/application-mysql.yml（已 gitignore，Spring Boot 会自动
# 从运行目录的 config/ 读取并覆盖本文件）或进程环境变量中配置：
#   MYSQL_HOST / MYSQL_PORT / MYSQL_DATABASE / MYSQL_USER / MYSQL_PASSWORD
# 切换其他数据库：新增 application-<db>.yml + db/migration/<db>/ 迁移脚本，
# 并用 SPRING_PROFILES_ACTIVE=<db> 启动，业务代码无需改动。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: AiAssistHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000   # 建立连接超时 10s（Hikari 原生字段单位为毫秒）
      max-lifetime: 1800000      # 连接最大存活 30m（毫秒）
  flyway:
    locations: classpath:db/migration/mysql
    baseline-on-migrate: true
